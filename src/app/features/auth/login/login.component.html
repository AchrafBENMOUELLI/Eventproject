<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">🔐 Connexion</h2>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
            {{ errorMessage }}
          </div>

          <!-- Login Form -->
          <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                [(ngModel)]="email"
                required
                email
                #emailField="ngModel"
                placeholder="votre.email@example.com"
              >
              <div *ngIf="emailField.touched && emailField.invalid" class="text-danger small mt-1">
                <div *ngIf="emailField.hasError('required')">Email requis</div>
                <div *ngIf="emailField.hasError('email')">Email invalide</div>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                [(ngModel)]="password"
                required
                #passwordField="ngModel"
                placeholder="Votre mot de passe"
              >
              <div *ngIf="passwordField.touched && passwordField.invalid" class="text-danger small mt-1">
                Mot de passe requis
              </div>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-primary w-100 mb-3"
              [disabled]="loginForm.invalid || isLoading"
            >
              <span *ngIf="!isLoading">🔓 Se connecter</span>
              <span *ngIf="isLoading">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Connexion en cours...
              </span>
            </button>

            <!-- Register Link -->
            <div class="text-center">
              <p class="mb-0">Pas encore de compte ?
                <a (click)="goToRegister()" class="text-primary" style="cursor: pointer;">S'inscrire</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
