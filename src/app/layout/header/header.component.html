<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <!-- Logo / Brand -->
    <a class="navbar-brand" routerLink="/">
      🎉 Eventy
    </a>

    <!-- Toggler pour mobile -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            🏠 Accueil
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/events" routerLinkActive="active">
            🎉 Événements
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn && authService.isOrganizer()">
          <a class="nav-link" routerLink="/events/newEvent" routerLinkActive="active">
            ➕ Créer un événement
          </a>
        </li>
      </ul>

      <!-- User Info / Auth Buttons -->
      <ul class="navbar-nav">
        <!-- Si connecté -->
        <ng-container *ngIf="isLoggedIn && currentUser">
          <!-- Nom et badge -->
          <li class="nav-item d-flex align-items-center me-3">
            <span class="text-white">
              👤 {{ currentUser.firstName }} {{ currentUser.lastName }}
            </span>
            <span class="badge bg-light text-dark ms-2">
              {{ currentUser.role === 'organizer' ? '🎫' :
                 currentUser.role === 'admin' ? '⚡' : '👤' }}
            </span>
          </li>

          <!-- Bouton Profil -->
          <li class="nav-item">
            <a class="nav-link" (click)="goToProfile()" style="cursor: pointer;">
              👤 Profil
            </a>
          </li>

          <!-- Bouton Mes événements (si organisateur) -->
          <li class="nav-item" *ngIf="authService.isOrganizer()">
            <a class="nav-link" routerLink="/events">
              🎉 Mes événements
            </a>
          </li>

          <!-- Bouton Déconnexion -->
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm ms-2" (click)="logout()">
              🚪 Déconnexion
            </button>
          </li>
        </ng-container>

        <!-- Si non connecté -->
        <ng-container *ngIf="!isLoggedIn">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login">
              🔐 Connexion
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm ms-2" routerLink="/register">
              📝 Inscription
            </a>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
